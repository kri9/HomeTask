services:
  mongodb:
    image: mongo:8.0
    container_name: task-management-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: task_management
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongodb_data: