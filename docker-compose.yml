services:
  api:
    build:
      context: .
    container_name: task-management-api
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/task_management
      DB_URL: jdbc:postgresql://postgres:5432/task_management
      DB_USERNAME: task_user
      DB_PASSWORD: SecretPostgresPassword
      JWT_SECRET: v1Dn1Og1AvyYngzYYQdubIG4G2RQL2k6XgKd0EWn21ixKD+gyLqHl9cFy3g0pWRF
      JWT_EXPIRATION: 1h
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-}"
    depends_on:
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  mongodb:
    image: mongo:8.0
    container_name: task-management-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: task_management
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: task-management-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: task_management
      POSTGRES_USER: task_user
      POSTGRES_PASSWORD: SecretPostgresPassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_user -d task_management"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongodb_data:
  postgres_data: