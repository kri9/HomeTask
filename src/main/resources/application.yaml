spring:
  application:
    name: task-management-api

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/task_management}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/task_management}
    username: ${DB_USERNAME:task_user}
    password: ${DB_PASSWORD:SecretPostgresPassword}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

jwt:
  secret: "${JWT_SECRET:v1Dn1Og1AvyYngzYYQdubIG4G2RQL2k6XgKd0EWn21ixKD+gyLqHl9cFy3g0pWRF}"
  expiration: ${JWT_EXPIRATION:1h}
  issuer: task-management-api